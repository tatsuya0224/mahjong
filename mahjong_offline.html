<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀スコア管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: #16213e; padding: 14px 16px; text-align: center; border-bottom: 2px solid #e94560; flex-shrink: 0; }
  header h1 { font-size: 20px; letter-spacing: 2px; color: #e94560; }
  nav { display: flex; background: #16213e; border-bottom: 1px solid #333; flex-shrink: 0; }
  nav button { flex: 1; padding: 10px 2px; background: none; border: none; color: #aaa; font-size: 12px; cursor: pointer; border-bottom: 3px solid transparent; }
  nav button.active { color: #e94560; border-bottom-color: #e94560; }
  .tab { display: none; padding: 16px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .tab.active { display: block; }
  .card { background: #16213e; border-radius: 10px; padding: 14px; margin-bottom: 14px; border: 1px solid #2a2a4a; }
  .card h3 { font-size: 14px; color: #e94560; margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; margin-top: 8px; }
  input, select { width: 100%; padding: 8px 10px; background: #0f3460; border: 1px solid #2a2a6a; border-radius: 6px; color: #eee; font-size: 16px; }
  input:focus, select:focus { outline: none; border-color: #e94560; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .row4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-secondary { background: #0f3460; color: #eee; border: 1px solid #2a2a6a; margin-top: 8px; }
  .btn-danger { background: #c0392b; color: #fff; margin-top: 8px; }
  .mode-toggle { display: flex; background: #0f3460; border-radius: 8px; padding: 4px; margin-bottom: 16px; }
  .mode-toggle button { flex: 1; padding: 8px; border: none; border-radius: 6px; background: none; color: #aaa; font-size: 14px; font-weight: bold; cursor: pointer; transition: all .2s; }
  .mode-toggle button.active { background: #e94560; color: #fff; }
  .score-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .score-table th { background: #0f3460; padding: 8px 4px; text-align: center; font-size: 12px; }
  .score-table td { padding: 7px 4px; text-align: center; border-bottom: 1px solid #2a2a4a; }
  .score-table tr:last-child td { font-weight: bold; color: #f1c40f; border-bottom: none; }
  .pos { color: #2ecc71; } .neg { color: #e74c3c; }
  .result-card { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 12px; border: 1px solid #2a2a4a; text-align: center; }
  .result-card .name { font-size: 15px; font-weight: bold; margin-bottom: 6px; }
  .result-card .total-yen { font-size: 28px; font-weight: bold; margin-bottom: 6px; }
  .result-card .breakdown { font-size: 12px; color: #888; display: flex; justify-content: center; gap: 12px; margin-bottom: 4px; }
  .result-card .pts { font-size: 13px; color: #aaa; }
  .rank-badge { display: inline-block; font-size: 11px; background: #0f3460; border-radius: 4px; padding: 2px 6px; margin-bottom: 6px; }
  .info-row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; padding: 4px 0; border-bottom: 1px solid #2a2a4a; }
  .info-row:last-child { border: none; }
  .round-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .round-num { font-size: 12px; background: #e94560; color: #fff; border-radius: 12px; padding: 2px 10px; }
  .del-btn  { background: none; border: 1px solid #c0392b; color: #c0392b; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .edit-btn { background: none; border: 1px solid #3498db; color: #3498db; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; margin-top: 3px; }
  .sum-ok { color: #2ecc71; font-size: 12px; text-align: right; margin-top: 6px; }
  .sum-ng { color: #e74c3c; font-size: 12px; text-align: right; margin-top: 6px; }
  .history-card { background: #16213e; border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #2a2a4a; }
  .history-card .date { font-size: 12px; color: #e94560; margin-bottom: 8px; }
  .history-card .h-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px solid #1a1a2e; }
  .history-card .h-row:last-child { border: none; }
  .history-del { float: right; background: none; border: 1px solid #555; color: #888; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
<header><h1>🀄 麻雀スコア管理</h1></header>
<nav>
  <button class="active" onclick="showTab('setup')">⚙️ 設定</button>
  <button onclick="showTab('input')">✏️ 入力</button>
  <button onclick="showTab('board')">📊 記録</button>
  <button onclick="showTab('result')">🏆 精算</button>
  <button onclick="showTab('history')">📁 履歴</button>
</nav>

<div id="tab-setup" class="tab active">
  <div class="mode-toggle">
    <button id="mode4-btn" class="active" onclick="setMode(4)">4人麻雀</button>
    <button id="mode3-btn" onclick="setMode(3)">3人麻雀</button>
  </div>
  <div class="card">
    <h3>👤 プレイヤー名</h3>
    <div id="player-inputs"></div>
  </div>
  <div class="card">
    <h3>🎯 ゲーム設定</h3>
    <div class="row2">
      <div><label>持ち点</label><input id="mochiten" type="number" value="25000"></div>
      <div><label>返し点</label><input id="kaeshi" type="number" value="30000"></div>
    </div>
    <div style="margin-top:8px">
      <label>ウマ</label>
      <div id="uma-inputs"></div>
      <div id="uma-hint" style="font-size:11px;color:#777;margin-top:3px"></div>
    </div>
    <div class="row2" style="margin-top:8px">
      <div><label>オカ</label>
        <select id="oka">
          <option value="1">あり（1位総取り）</option>
          <option value="0">なし</option>
        </select>
      </div>
      <div><label>飛び賞（pt）</label>
        <select id="tobisho">
          <option value="10" selected>あり（10pt）</option>
          <option value="20">あり（20pt）</option>
          <option value="0">なし</option>
        </select>
      </div>
    </div>
    <div class="row2" style="margin-top:8px">
      <div><label>レート（円/千点）</label><input id="rate" type="number" value="100"></div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="saveSettings()">設定を保存して入力へ →</button>
</div>

<div id="tab-input" class="tab">
  <div class="card">
    <div class="round-header">
      <h3>半荘入力</h3>
      <span class="round-num" id="round-num">第1局</span>
    </div>
    <div id="score-inputs"></div>
    <div id="score-sum"></div>
    <div id="tobi-section" style="display:none;margin-top:12px;padding-top:10px;border-top:1px solid #2a2a4a">
      <h3 style="font-size:14px;color:#e94560;margin-bottom:8px">💥 飛び賞</h3>
      <div id="tobi-fields"></div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="addRound()">この局を記録 ✓</button>
  <button class="btn btn-secondary" onclick="showTab('board')">記録を見る →</button>
</div>

<div id="tab-board" class="tab">
  <div id="board-content"></div>
  <button class="btn btn-secondary" onclick="showTab('input')">← 次の局を入力</button>
  <button class="btn btn-primary" style="margin-top:8px" onclick="showTab('result')">精算を見る 🏆</button>
</div>

<div id="tab-result" class="tab">
  <div id="result-content"></div>
  <button id="reset-btn" class="btn btn-danger" onclick="resetAll()">💾 保存してリセット</button>
</div>

<div id="tab-history" class="tab">
  <div id="history-content"></div>
</div>

<script>
  let S = {
    mode: 4,
    players: ['東家','南家','西家','北家'],
    mochiten: 25000, kaeshi: 30000,
    uma: [60,30,-30,-60], oka: 1, tobisho: 10, rate: 100
  };
  let rounds = [];
  let editingRound = null;
  let chips = { rate: 0, counts: [0,0,0,0] };
  let venue = { amount: 0, payer: 0 };

  const N = () => S.mode;
  const RANKS = ['🥇','🥈','🥉','4位'];
  const DEFAULT_PLAYERS = { 4: ['東家','南家','西家','北家'], 3: ['東家','南家','西家'] };
  const MODE_DEFAULTS = {
    4: { mochiten: 25000, kaeshi: 30000, rate: 100, uma: [60,30,-30,-60] },
    3: { mochiten: 35000, kaeshi: 40000, rate: 50,  uma: [60,0,-60] }
  };

  /* ---------- localStorage ストレージ ---------- */
  const storage = {
    set(key, value) { try { localStorage.setItem(key, value); return true; } catch(e) { return false; } },
    get(key) { try { const v = localStorage.getItem(key); return v !== null ? { value: v } : null; } catch(e) { return null; } },
    delete(key) { try { localStorage.removeItem(key); return true; } catch(e) { return false; } },
    list(prefix) {
      try {
        const keys = [];
        for(let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if(k && k.startsWith(prefix)) keys.push(k);
        }
        return { keys };
      } catch(e) { return { keys: [] }; }
    }
  };

  /* ---------- モード切替 ---------- */
  function setMode(m) {
    S.mode = m;
    document.getElementById('mode4-btn').classList.toggle('active', m===4);
    document.getElementById('mode3-btn').classList.toggle('active', m===3);
    const d = MODE_DEFAULTS[m];
    document.getElementById('mochiten').value = d.mochiten;
    document.getElementById('kaeshi').value   = d.kaeshi;
    document.getElementById('rate').value     = d.rate;
    S.uma = d.uma.slice();
    renderPlayerInputs();
    renderUmaInputs();
  }

  function renderPlayerInputs() {
    const defs = DEFAULT_PLAYERS[N()];
    const cols = N()===3 ? 'row3' : 'row4';
    document.getElementById('player-inputs').innerHTML =
      '<div class="'+cols+'">'+
      defs.map((d,i)=>'<div><label>'+(i+1)+'P</label><input id="p'+i+'" value="'+(document.getElementById('p'+i)?.value||d)+'"></div>').join('')+
      '</div>';
  }

  function renderUmaInputs() {
    if(N()===4) {
      document.getElementById('uma-inputs').innerHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+
        '<input id="uma0" type="number" value="'+(S.uma[0]||60)+'" placeholder="1位">'+
        '<input id="uma1" type="number" value="'+(S.uma[1]||30)+'" placeholder="2位">'+
        '</div>';
      document.getElementById('uma-hint').textContent = '3・4位は自動でマイナス反転';
    } else {
      document.getElementById('uma-inputs').innerHTML =
        '<div class="row3">'+
        '<div><label>1位</label><input id="uma0" type="number" value="'+(S.uma[0]||60)+'"></div>'+
        '<div><label>2位</label><input id="uma1" type="number" value="'+(S.uma[1]||0)+'"></div>'+
        '<div><label>3位</label><input id="uma2" type="number" value="'+(S.uma[2]||-60)+'"></div>'+
        '</div>';
      document.getElementById('uma-hint').textContent = '3人の場合は全て手入力';
    }
  }

  /* ---------- タブ ---------- */
  function showTab(name) {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    ['setup','input','board','result','history'].forEach((t,i)=>{if(t===name)document.querySelectorAll('nav button')[i].classList.add('active');});
    if(name==='input')   renderInput();
    if(name==='board')   renderBoard();
    if(name==='result')  renderResult();
    if(name==='history') renderHistory();
  }

  /* ---------- 設定保存 ---------- */
  function saveSettings() {
    const n = N();
    S.players  = Array.from({length:n},(_,i)=>document.getElementById('p'+i)?.value||'P'+(i+1));
    S.mochiten = +document.getElementById('mochiten').value||25000;
    S.kaeshi   = +document.getElementById('kaeshi').value||30000;
    S.oka      = +document.getElementById('oka').value;
    S.tobisho  = +document.getElementById('tobisho').value;
    S.rate     = +document.getElementById('rate').value||100;
    if(n===4) {
      const u0=+document.getElementById('uma0').value||0, u1=+document.getElementById('uma1').value||0;
      S.uma = [u0,u1,-u1,-u0];
    } else {
      S.uma = [+document.getElementById('uma0').value||0, +document.getElementById('uma1').value||0, +document.getElementById('uma2').value||0];
    }
    chips = {rate:0, counts:Array(n).fill(0)};
    venue = {amount:0, payer:0};
    showTab('input');
  }

  /* ---------- 入力フォーム ---------- */
  function renderInput() {
    document.getElementById('round-num').textContent='第'+(rounds.length+1)+'局';
    const n=N(), total=S.mochiten*n;
    const defaults4=[47600,32400,20000,total-47600-32400-20000];
    const d0=Math.round(total*0.45/100)*100, d1=Math.round(total*0.29/100)*100;
    const defaults3=[d0,d1,total-d0-d1];
    const defs=n===4?defaults4:defaults3;
    document.getElementById('score-inputs').innerHTML=S.players.map((p,i)=>
      '<div style="margin-bottom:8px"><label>'+p+'</label>'+
      '<input type="number" id="si'+i+'" value="'+defs[i]+'" oninput="updateSum()"></div>'
    ).join('');
    updateSum();
  }

  function getScoreVals(prefix='') {
    return Array.from({length:N()},(_,i)=>{const el=document.getElementById(prefix+'si'+i);return(!el||el.value==='')?null:+el.value;});
  }

  function updateSum(prefix='') {
    const vals=getScoreVals(prefix);
    const valid=vals.every(v=>v!==null&&!isNaN(v));
    const el=document.getElementById(prefix?'edit-sum':'score-sum');
    if(el&&valid) {
      const total=vals.reduce((a,b)=>a+b,0), diff=total-S.mochiten*N();
      el.className=diff===0?'sum-ok':'sum-ng';
      el.textContent='合計: '+total.toLocaleString()+'点 '+(diff===0?'✓':'('+(diff>0?'+':'')+diff+'点ズレあり)');
    } else if(el) el.textContent='';
    renderTobiFields(vals, prefix);
  }

  function renderTobiFields(vals, prefix='') {
    const ts=document.getElementById(prefix?'edit-tobi-section':'tobi-section');
    const tf=document.getElementById(prefix?'edit-tobi-fields':'tobi-fields');
    if(!ts||!S.tobisho) return;
    const flown=vals.map((v,i)=>({v,i})).filter(x=>x.v!==null&&x.v<0);
    if(!flown.length){ts.style.display='none';return;}
    ts.style.display='block';
    tf.innerHTML=flown.map(f=>
      '<div style="margin-bottom:10px"><label style="color:#e74c3c">🀄 '+S.players[f.i]+'（飛び）を飛ばしたのは？</label>'+
      '<select id="'+prefix+'tobashi_'+f.i+'">'+
        S.players.map((p,i)=>i===f.i?'':`<option value="${i}">${p}</option>`).join('')+
      '</select></div>'
    ).join('');
  }

  /* ---------- 点数計算 ---------- */
  function goshaku(s){return(Math.floor((s%1000)/100)>=6?Math.floor(s/1000)+1:Math.floor(s/1000))*1000;}

  function calcPts(scores, prefix) {
    const n=scores.length;
    const base=scores.map(s=>(goshaku(s)-S.kaeshi)/1000);
    const ranked=scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
    const ranks=new Array(n); ranked.forEach((r,rank)=>ranks[r.i]=rank);
    const okaVal=S.oka?(S.kaeshi-S.mochiten)*n/1000:0;
    const pts=base.map((b,i)=>{let p=b+S.uma[ranks[i]];if(S.oka&&ranks[i]===0)p+=okaVal;return p;});
    if(S.tobisho) {
      scores.forEach((s,i)=>{
        const sel=document.getElementById(prefix+'tobashi_'+i);
        if(s<0&&sel){const j=+sel.value;pts[j]+=S.tobisho;pts[i]-=S.tobisho;}
      });
    }
    return {pts,ranks};
  }

  /* ---------- 局追加 ---------- */
  function addRound(){
    const scores=getScoreVals();
    if(scores.some(s=>s===null||isNaN(s))){alert('全員の素点を入力してください');return;}
    const{pts,ranks}=calcPts(scores,'');
    rounds.push({scores,pts,ranks});
    showTab('board');
  }

  /* ---------- 記録 ---------- */
  function renderBoard(){
    const cont=document.getElementById('board-content');
    if(!rounds.length){cont.innerHTML='<div class="card" style="text-align:center;color:#aaa">まだ記録がありません</div>';return;}
    const totals=Array.from({length:N()},(_,i)=>rounds.reduce((s,r)=>s+r.pts[i],0));
    let h='<div class="card"><h3 style="margin-bottom:10px">📋 スコア一覧</h3>'+
      '<table class="score-table"><thead><tr><th>局</th>'+S.players.map(p=>'<th>'+p+'</th>').join('')+'</tr></thead><tbody>';
    rounds.forEach((r,idx)=>{
      h+='<tr><td><span style="font-size:11px">第'+(idx+1)+'局</span><br>'+
        '<button class="del-btn" id="del_'+idx+'" onclick="deleteRound('+idx+')">削除</button><br>'+
        '<button class="edit-btn" onclick="startEdit('+idx+')">編集</button></td>';
      r.pts.forEach((p,i)=>{h+='<td class="'+(p>0?'pos':p<0?'neg':'')+'">'+(p>0?'+':'')+Math.round(p)+'<br><span style="font-size:10px;color:#777">'+r.scores[i].toLocaleString()+'</span></td>';});
      h+='</tr>';
    });
    h+='<tr><td>合計</td>'+totals.map(t=>'<td class="'+(t>0?'pos':t<0?'neg':'')+'">'+(t>0?'+':'')+Math.round(t)+'</td>').join('')+'</tr>';
    h+='</tbody></table></div>';
    if(editingRound!==null){
      const r=rounds[editingRound];
      h+='<div class="card" style="border-color:#3498db">'+
        '<div class="round-header"><h3 style="color:#3498db">✏️ 第'+(editingRound+1)+'局を修正</h3></div>'+
        S.players.map((p,i)=>'<div style="margin-bottom:8px"><label>'+p+'</label><input type="number" id="edit_si'+i+'" value="'+r.scores[i]+'" oninput="updateSum(\'edit_\')"></div>').join('')+
        '<div id="edit-sum"></div>'+
        '<div id="edit-tobi-section" style="display:none;padding-top:10px;border-top:1px solid #2a2a4a;margin-bottom:10px">'+
          '<h3 style="font-size:14px;color:#e94560;margin-bottom:8px">💥 飛び賞</h3><div id="edit-tobi-fields"></div></div>'+
        '<div class="row2"><button class="btn btn-primary" onclick="saveEdit()">保存</button>'+
        '<button class="btn btn-secondary" style="margin-top:0" onclick="cancelEdit()">キャンセル</button></div></div>';
    }
    cont.innerHTML=h;
    if(editingRound!==null){updateSum('edit_');document.getElementById('board-content').lastElementChild.scrollIntoView({behavior:'smooth'});}
  }

  function deleteRound(idx){
    const btn=document.getElementById('del_'+idx);if(!btn)return;
    if(btn.dataset.confirm==='1'){rounds.splice(idx,1);editingRound=null;renderBoard();}
    else{btn.dataset.confirm='1';btn.textContent='本当に削除？';setTimeout(()=>{if(btn&&btn.dataset.confirm==='1'){btn.dataset.confirm='0';btn.textContent='削除';}},3000);}
  }
  function startEdit(idx){editingRound=idx;renderBoard();}
  function cancelEdit(){editingRound=null;renderBoard();}

  function saveEdit(){
    const scores=Array.from({length:N()},(_,i)=>{const el=document.getElementById('edit_si'+i);return(!el||el.value==='')?null:+el.value;});
    if(scores.some(s=>s===null||isNaN(s))){alert('全員の素点を入力してください');return;}
    const{pts,ranks}=calcPts(scores,'edit_');
    rounds[editingRound]={scores,pts,ranks};
    editingRound=null;renderBoard();
  }

  /* ---------- 精算 ---------- */
  function renderResult(){
    const cont=document.getElementById('result-content');
    if(!rounds.length){cont.innerHTML='<div class="card" style="text-align:center;color:#aaa">記録がありません</div>';return;}
    const totals=Array.from({length:N()},(_,i)=>rounds.reduce((s,r)=>s+r.pts[i],0));
    const order=[...Array(N()).keys()].sort((a,b)=>totals[b]-totals[a]);
    let h='<div class="card"><h3>⚙️ 設定確認</h3>'+
      '<div class="info-row"><span>人数</span><span>'+N()+'人麻雀</span></div>'+
      '<div class="info-row"><span>持ち点/返し点</span><span>'+S.mochiten.toLocaleString()+' / '+S.kaeshi.toLocaleString()+'</span></div>'+
      '<div class="info-row"><span>ウマ</span><span>'+S.uma.join('/')+'</span></div>'+
      '<div class="info-row"><span>オカ</span><span>'+(S.oka?'あり':'なし')+'</span></div>'+
      '<div class="info-row"><span>飛び賞</span><span>'+(S.tobisho?S.tobisho+'pt':'なし')+'</span></div>'+
      '<div class="info-row"><span>レート</span><span>'+S.rate+'円/千点</span></div>'+
      '<div class="info-row"><span>半荘数</span><span>'+rounds.length+'局</span></div></div>';
    order.forEach((pi,rank)=>{
      h+='<div class="result-card"><div class="rank-badge">'+RANKS[rank]+'</div>'+
        '<div class="name">'+S.players[pi]+'</div>'+
        '<div class="total-yen" id="yen_'+pi+'"></div>'+
        '<div class="breakdown" id="breakdown_'+pi+'"></div>'+
        '<div class="pts">'+(totals[pi]>0?'+':'')+Math.round(totals[pi])+'pt</div></div>';
    });
    h+='<div class="card"><h3>🏠 場代</h3><div class="row2">'+
      '<div><label>場代（円）</label><input type="text" inputmode="numeric" id="venue_amount" value="'+venue.amount+'" placeholder="0"></div>'+
      '<div><label>建て替えた人</label><select id="venue_payer">'+S.players.map((p,i)=>'<option value="'+i+'"'+(venue.payer===i?' selected':'')+'>'+p+'</option>').join('')+'</select></div>'+
      '</div><div id="venue-breakdown" style="font-size:12px;color:#aaa;margin-top:8px"></div></div>';
    h+='<div class="card"><h3>🪙 チップ精算</h3>'+
      '<div style="margin-bottom:12px"><label>チップ単価（円/枚）</label><select id="chip_rate_sel">'+
      '<option value="0">なし</option><option value="300">300円</option><option value="500">500円</option><option value="1000">1000円</option></select></div>'+
      '<div class="row4">'+S.players.map((p,i)=>'<div><label>'+p+'</label><input type="text" inputmode="numeric" id="chip_inp_'+i+'" value="'+chips.counts[i]+'" placeholder="0"></div>').join('')+'</div>'+
      '<div id="chip-sum" style="font-size:12px;text-align:right;margin-top:8px"></div></div>';
    h+='<div class="card"><h3>💸 支払い精算</h3><div id="settlement-body"></div></div>';
    cont.innerHTML=h;
    document.getElementById('venue_amount').addEventListener('input',e=>{venue.amount=parseInt(e.target.value)||0;calcResult();});
    document.getElementById('venue_payer').addEventListener('change',e=>{venue.payer=+e.target.value;calcResult();});
    document.getElementById('chip_rate_sel').value=chips.rate;
    document.getElementById('chip_rate_sel').addEventListener('change',e=>{chips.rate=+e.target.value;calcResult();});
    Array.from({length:N()},(_,i)=>document.getElementById('chip_inp_'+i).addEventListener('input',e=>{chips.counts[i]=parseInt(e.target.value)||0;calcResult();}));
    calcResult();
  }

  function calcResult(){
    const n=N();
    const totals=Array.from({length:n},(_,i)=>rounds.reduce((s,r)=>s+r.pts[i],0));
    const share=Math.round(venue.amount/n);
    const moneys=totals.map((t,i)=>Math.round(t*S.rate)+chips.counts[i]*chips.rate+(i===venue.payer?share*(n-1):-share));
    const vb=document.getElementById('venue-breakdown');
    if(vb) vb.textContent=venue.amount>0?'1人あたり'+share.toLocaleString()+'円 ／ '+S.players[venue.payer]+'が'+venue.amount.toLocaleString()+'円立替 → 他'+(n-1)+'名が各'+share.toLocaleString()+'円を支払い':'';
    const chipTotal=chips.counts.slice(0,n).reduce((a,b)=>a+b,0);
    const cs=document.getElementById('chip-sum');
    if(cs){cs.style.color=chipTotal===0?'#2ecc71':'#e74c3c';cs.textContent='チップ合計: '+(chipTotal>0?'+':'')+chipTotal+'枚 '+(chipTotal===0?'✓':'← ゼロサムになっていません');}
    Array.from({length:n},(_,i)=>{
      const scoreYen=Math.round(totals[i]*S.rate),chipYen=chips.counts[i]*chips.rate,total=moneys[i];
      const ye=document.getElementById('yen_'+i),bd=document.getElementById('breakdown_'+i);
      if(ye){ye.style.color=total>=0?'#2ecc71':'#e74c3c';ye.textContent=(total>=0?'+':'')+total.toLocaleString()+'円';}
      if(bd){
        const parts=['スコア: '+(scoreYen>=0?'+':'')+scoreYen.toLocaleString()+'円'];
        if(chips.rate>0) parts.push('チップ: '+(chipYen>=0?'+':'')+chipYen.toLocaleString()+'円');
        if(venue.amount>0){const adj=i===venue.payer?share*(n-1):-share;parts.push('場代: '+(adj>=0?'+':'')+adj.toLocaleString()+'円');}
        bd.innerHTML=parts.map(p=>'<span>'+p+'</span>').join('');
      }
    });
    const tmp=moneys.slice(0,n).map((v,i)=>({v,i}));tmp.sort((a,b)=>a.v-b.v);
    const st=[];let lo=0,hi=n-1;
    while(lo<hi){const pay=Math.min(-tmp[lo].v,tmp[hi].v);if(pay>0)st.push({from:tmp[lo].i,to:tmp[hi].i,amt:pay});tmp[lo].v+=pay;tmp[hi].v-=pay;if(tmp[lo].v===0)lo++;if(tmp[hi].v===0)hi--;}
    const sb=document.getElementById('settlement-body');
    if(sb) sb.innerHTML=st.length?st.map(s=>'<div class="info-row"><span style="color:#e74c3c">▶ '+S.players[s.from]+'</span><span>→ <b style="color:#f1c40f">'+S.players[s.to]+'</b> に <b>'+s.amt.toLocaleString()+'円</b></span></div>').join(''):'<div style="color:#aaa;font-size:13px">精算なし</div>';
  }

  /* ---------- 保存してリセット ---------- */
  function resetAll(){
    const btn=document.getElementById('reset-btn');if(!btn)return;
    if(btn.dataset.confirm!=='1'){
      btn.dataset.confirm='1';btn.textContent='本当に保存してリセット？';
      setTimeout(()=>{if(btn&&btn.dataset.confirm==='1'){btn.dataset.confirm='0';btn.textContent='💾 保存してリセット';}},3000);return;
    }
    if(!rounds.length){btn.dataset.confirm='0';btn.textContent='💾 保存してリセット';return;}
    const n=N();
    const totals=Array.from({length:n},(_,i)=>rounds.reduce((s,r)=>s+r.pts[i],0));
    const share=Math.round(venue.amount/n);
    const moneys=totals.map((t,i)=>Math.round(t*S.rate)+chips.counts[i]*chips.rate+(i===venue.payer?share*(n-1):-share));
    const tmp=moneys.map((v,i)=>({v,i}));tmp.sort((a,b)=>a.v-b.v);
    const settlements=[];let lo=0,hi=n-1;
    while(lo<hi){const pay=Math.min(-tmp[lo].v,tmp[hi].v);if(pay>0)settlements.push({from:S.players[tmp[lo].i],to:S.players[tmp[hi].i],amt:pay});tmp[lo].v+=pay;tmp[hi].v-=pay;if(tmp[lo].v===0)lo++;if(tmp[hi].v===0)hi--;}
    const record={
      date:new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
      mode:n+'人麻雀', players:S.players.slice(), rounds:rounds.length, rate:S.rate,
      results:S.players.map((p,i)=>({name:p,pts:Math.round(totals[i]),money:moneys[i],chips:chips.counts[i]})),
      chipRate:chips.rate, venue:{amount:venue.amount,payer:S.players[venue.payer]||''}, settlements
    };
    storage.set('session:'+Date.now(), JSON.stringify(record));
    rounds=[];chips={rate:0,counts:Array(n).fill(0)};venue={amount:0,payer:0};
    btn.dataset.confirm='0';btn.textContent='💾 保存してリセット';
    showTab('setup');
  }

  /* ---------- 履歴 ---------- */
  function renderHistory(){
    const cont=document.getElementById('history-content');
    const {keys=[]}=storage.list('session:');
    if(!keys.length){cont.innerHTML='<div class="card" style="text-align:center;color:#aaa">保存された履歴がありません</div>';return;}
    keys.sort().reverse();
    const records=keys.map(k=>{const r=storage.get(k);return r?{key:k,data:JSON.parse(r.value)}:null;}).filter(Boolean);
    cont.innerHTML=records.map(({key,data})=>{
      const rows=data.results.sort((a,b)=>b.money-a.money).map(r=>
        '<div class="h-row"><span>'+r.name+'</span><span style="color:'+(r.money>=0?'#2ecc71':'#e74c3c')+'">'+(r.money>=0?'+':'')+r.money.toLocaleString()+'円 ('+(r.pts>=0?'+':'')+r.pts+'pt)</span></div>'
      ).join('');
      const stRows=data.settlements.map(s=>'<div class="h-row" style="font-size:12px"><span style="color:#e74c3c">'+s.from+'</span><span>→ <b style="color:#f1c40f">'+s.to+'</b> に '+s.amt.toLocaleString()+'円</span></div>').join('');
      const venueRow=data.venue&&data.venue.amount>0?'<div class="h-row"><span>場代</span><span>'+data.venue.amount.toLocaleString()+'円（'+data.venue.payer+'立替）</span></div>':'';
      const chipRow=data.chipRate>0?'<div class="h-row"><span>チップ単価</span><span>'+data.chipRate+'円/枚</span></div>':'';
      return '<div class="history-card">'+
        '<div class="date">'+data.date+' ／ '+data.rounds+'半荘 ／ '+data.rate+'円/千点 ／ '+(data.mode||'')+
        ' <button class="history-del" onclick="deleteHistory(\''+key+'\')">削除</button></div>'+
        rows+
        (stRows?'<div style="margin-top:6px;padding-top:6px;border-top:1px solid #2a2a4a">'+stRows+'</div>':'')+
        (venueRow||chipRow?'<div style="margin-top:6px;padding-top:6px;border-top:1px solid #2a2a4a">'+venueRow+chipRow+'</div>':'')+
        '</div>';
    }).join('');
  }

  function deleteHistory(key){
    storage.delete(key);
    renderHistory();
  }

  /* ---------- 初期化 ---------- */
  setMode(4);
  renderInput();
</script>
</body>
</html>
